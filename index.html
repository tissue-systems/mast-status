<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="refresh" content="120">
<title>Tissue Mast status</title>
<style>
:root{--bg:#ffffff;--fg:#1b1d1f;--muted:#5d6166;--line:#d9dcdf;--ok:#1f7a3a;--warn:#9a5b00;--bad:#b3261e}
@media (prefers-color-scheme: dark){:root{--bg:#121416;--fg:#e8eaec;--muted:#9aa0a6;--line:#2c3034;--ok:#5cc07a;--warn:#e0a44a;--bad:#f07a70}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:44rem;margin:0 auto;padding:2rem 16px 3rem}
h1{font-size:1.6rem;font-weight:600;margin:0 0 .25rem}
h2{font-size:1.1rem;font-weight:600;margin:2rem 0 .5rem;border-bottom:1px solid var(--line);padding-bottom:.25rem}
p{margin:.5rem 0}
.muted{color:var(--muted);font-size:.9rem}
.state-ok{color:var(--ok)}.state-degraded,.state-unknown,.state-paused{color:var(--warn)}.state-down{color:var(--bad)}
ul{padding-left:1.2rem;margin:.5rem 0}
li{margin:.25rem 0}
table{border-collapse:collapse;width:100%}
td{padding:.35rem 0;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;white-space:nowrap;padding-left:1rem}
.notice{border-left:3px solid var(--warn);padding:.25rem 0 .25rem .75rem;white-space:pre-wrap}
a{color:inherit}
</style></head><body><main>
<h1 id="headline" class="state-unknown" data-rendered="0" data-stale-min="10">State unknown</h1>
<p class="muted">Tissue Mast status. The monitor outside the Tissue fleet has not written this page yet. Until it does, treat it as stale.</p>
<p id="stale-note" class="state-degraded" hidden>This page has not been rewritten for over 10 minutes. What it says below may be out of date.</p>
<h2>Elsewhere</h2><p class="muted">Platform status: <a href="https://tissue.systems/status">tissue.systems/status</a>.
</p>
<script>
(function(){var h=document.getElementById('headline');var t=+h.getAttribute('data-rendered');var m=+h.getAttribute('data-stale-min');
function chk(){if(Date.now()/1000-t>m*60&&h.textContent.indexOf('stale')<0){h.textContent='stale: '+h.textContent;document.getElementById('stale-note').hidden=false;}}
chk();setInterval(chk,30000);})();
</script>
</main></body></html>
